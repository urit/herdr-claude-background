id = "urit.claude-background"
name = "Claude background work"
version = "0.3.8"
min_herdr_version = "0.9.1"
description = "Show each Claude Code agent's subagents, monitors, shells, workflows, cron jobs and watched artifacts as rows under it in the sidebar, and warn about processes Claude left orphaned"
platforms = ["macos", "linux"]

# Starts a detached supervisor that keeps one watcher running for as long as
# herdr answers; a second start is a no-op.
[[startup]]
command = ["python3", "claude_bg_watch.py", "--start"]

[[actions]]
id = "start"
title = "Claude background work: start"
contexts = ["workspace"]
command = ["python3", "claude_bg_watch.py", "--start"]

[[actions]]
id = "stop"
title = "Claude background work: stop"
contexts = ["workspace"]
command = ["python3", "claude_bg_watch.py", "--stop"]

[[actions]]
id = "orphans"
title = "Claude background work: list orphaned processes"
contexts = ["workspace"]
command = ["python3", "claude_bg_watch.py", "--orphans"]

[[actions]]
id = "install-rows"
title = "Claude background work: add sidebar rows to config.toml"
contexts = ["workspace"]
command = ["python3", "install_rows.py"]

# Bind a key to it in config.toml ([[keys.command]], type = "plugin_action",
# command = "urit.claude-background.open-review"); sidebar rows can't be links.
[[actions]]
id = "open-review"
title = "Claude background work: open the focused agent's review pages"
contexts = ["workspace"]
command = ["python3", "claude_bg_watch.py", "--open-review"]
